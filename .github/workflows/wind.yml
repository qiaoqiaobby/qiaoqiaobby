name: Wind & Temp Chart
on:
  schedule:
    - cron: "13 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wind
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 渲染失败即整个 job 失败、不执行 push，output 分支旧图自然保留
      - name: Render wind & temp chart
        run: python3 scripts/render_wind.py dist
      - name: Push to output branch
        run: |
          git clone --depth 1 --branch output "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out
          cp dist/*.svg out/
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "chore: update wind chart $(date -u +%FT%TZ)"; git push || { git pull --rebase && git push; }; }
