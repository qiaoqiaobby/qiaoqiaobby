name: Contribution Snake
on:
  schedule:
    - cron: "47 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: qiaoqiaobby
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      # 统一增量部署：不用替换式部署，避免清掉 output 分支上其他 workflow 的产物
      - name: Push to output branch
        run: |
          git clone --depth 1 --branch output "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out
          cp dist/*.svg out/
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "chore: update contribution snake $(date -u +%FT%TZ)"; git push || { git pull --rebase && git push; }; }
