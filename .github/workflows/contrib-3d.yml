name: 3D Contribution Graph
on:
  schedule:
    - cron: "29 19 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contrib-3d
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Collect dark/light variants
        run: |
          mkdir -p dist
          cp profile-3d-contrib/profile-night-green.svg dist/contrib-3d-dark.svg
          cp profile-3d-contrib/profile-green-animate.svg dist/contrib-3d-light.svg
      - name: Push to output branch
        run: |
          git clone --depth 1 --branch output "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out
          cp dist/*.svg out/
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "chore: update 3d contribution graph $(date -u +%FT%TZ)"; git push || { git pull --rebase && git push; }; }
